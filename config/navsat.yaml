# =============================================================================
# navsat_transform 配置 — GPS 坐标转换 (硬件优化版)
# =============================================================================
# 修改记录:
#   2026-06-17: 增加 use_odometry_yaw, 降低频率避免插值过多, 增加诊断
# =============================================================================

navsat_transform:
  ros__parameters:
    use_sim_time: false

    # ╔══════════════════════════════════════════════════════════════╗
    # ║  🔧 频率 10.0 → 5.0 Hz                                    ║
    # ║  原因: 如果原始 GPS 只有 1-5Hz, 10Hz 输出大量插值/外推    ║
    # ║  5Hz 降低了虚假数据的注入量                                ║
    # ║  实测时可调: 如果 GPS 稳定 10Hz 输出, 可恢复为 10.0       ║
    # ╚══════════════════════════════════════════════════════════════╝
    frequency: 5.0

    delay: 0.0

    # 磁偏角 (天津约 -7°, 但若 RTK 已输出真北则设 0)
    magnetic_declination_radians: 0.0

    # GPS 天线安装偏移: 天线指向 vs 车头方向
    # π/2 = 天线朝向相对于车头右偏 90°
    # ⚠️ 如果你不确定这个值, 可以原地转一圈观察 /odometry/gps 的方向是否正确
    yaw_offset: 1.5707963

    # 2D 导航, 忽略海拔
    zero_altitude: true

    # 发布 UTM→map 坐标变换 (EKF 需要这个来进行 GPS 融合)
    broadcast_cartesian_transform: true
    broadcast_cartesian_transform_as_parent_frame: false

    # 不发布过滤后的 GPS (减少话题数量)
    publish_filtered_gps: false

    # ╔══════════════════════════════════════════════════════════════╗
    # ║  🔧 use_odometry_yaw: true → false                         ║
    # ║  原因: UM982 双天线可提供绝对航向, 给 EKF 做航向参考       ║
    # ║  之前用 true 导致 /odometry/gps 方向=EKF 自己死推算的 yaw  ║
    # ║  → EKF yaw 没有绝对参考 → 代价地图旋转 → 螺旋畸变          ║
    # ╚══════════════════════════════════════════════════════════════╝
    use_odometry_yaw: false

    # 不等待基准点 (让 navsat 自己确定原点)
    wait_for_datum: false

    # ╔══════════════════════════════════════════════════════════════╗
    # ║  🔧 新增: datum 配置 (GPS 基准点)                          ║
    # ║  如果留空, navsat 会自动用第一个 GPS 坐标作为原点          ║
    # ║  如果你想固定原点 (比如校园某处), 填写下面的 lat/lon/alt   ║
    # ╚══════════════════════════════════════════════════════════════╝
    # datum: [39.1, 117.2, 5.0]  # 天津示例坐标, 按实际修改
